name: Build SAKSHAM Android App (APK & Bundle)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Production Bundle
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK (Debug)
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Android App Bundle (Release AAB for Play Store)
        run: |
          cd client/android
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAKSHAM-Android-Debug-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: SAKSHAM-PlayStore-AAB
          path: client/android/app/build/outputs/bundle/release/app-release.aab
